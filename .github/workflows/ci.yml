name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo. The GITHUB_TOKEN gets no
# write scopes, so a compromised dependency can't push code, tags, or releases.
permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to an immutable commit SHA (not a mutable @vN tag) so
      # a hijacked tag can't silently swap the action out from under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install agent + test deps
        run: pip install "./agent[dev]"
      - name: Run tests
        run: python -m pytest -q

  webview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build webview
        working-directory: webview
        run: |
          npm ci
          npm run build
