name: keep-warm

# Render's free web service spins down after ~15 min idle, and a cold start
# takes 30–60s — long enough that the first pilgrim to open an activity used to
# see "couldn't load". Ping /health every ~10 min so the agent stays awake and
# activities load instantly. Best-effort: a slow wake still triggers the boot,
# so the job never fails (no red-X noise) — it just records the final status.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay under load)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping agent health (wakes the service)
        run: |
          URL="https://yatra-sahayak-agent.onrender.com/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then echo "agent is awake"; exit 0; fi
            sleep 15
          done
          echo "::notice::agent did not return 200 within the window; the ping still triggered a wake"
