# Serve the whole app at yatri.adityeah.ai through a Cloudflare tunnel.
#   docker compose -f deploy/docker-compose.yml up -d --build
# See docs/deploy-cloudflare-tunnel.md for the one-time Cloudflare setup.
services:
  agent:
    build:
      context: ..                      # repo root
      dockerfile: deploy/Dockerfile
      args:
        # UI calls the API on the same origin (the tunnel host) — no CORS.
        VITE_AGENT_URL: https://yatri.adityeah.ai
        VITE_AGENT_KEY: ${INTERNAL_API_KEY}
    env_file: .env
    environment:
      DATA_DIR: /app/data
      WEBVIEW_DIST: /app/webview/dist
      PUBLIC_WEBVIEW_BASE: https://yatri.adityeah.ai
      CORS_ORIGINS: https://yatri.adityeah.ai
    expose:
      - "8000"                         # reachable by cloudflared on the compose network; not published to the host
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - agent
    # The tunnel's public hostname (yatri.adityeah.ai) is mapped to
    # http://agent:8000 in the Cloudflare Zero Trust dashboard (see the runbook).
