services:
  - type: web
    name: yatra-sahayak-agent
    runtime: python
    plan: free
    rootDir: agent
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn webhook:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false                 # set on the dashboard (Realtime access needed for voice)
      - key: INTERNAL_API_KEY
        generateValue: true
      # Officer/admin key — guards the pilgrim-PII export (/api/registrations).
      # Distinct from INTERNAL_API_KEY (which the webview ships to the browser).
      - key: ADMIN_API_KEY
        generateValue: true
      # Postgres — provisioned by the `databases` block below, wired in here so
      # registrations/SOS persist across restarts (DB_ENABLED flips on).
      - key: DATABASE_URL
        fromDatabase:
          name: yatra-sahayak-db
          property: connectionString
      - key: LLM_MAIN_MODEL
        value: gpt-4o-mini
      - key: PUBLIC_WEBVIEW_BASE
        value: https://yatra-sahayak-agent.vercel.app
      # LiveKit — set these three on the dashboard (the worker inherits them
      # via fromService, so you only paste them here, once).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: AGENT_NAME
        value: yatra-sahayak-voice

  - type: worker
    name: yatra-sahayak-voice
    runtime: python
    plan: starter
    rootDir: agent
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: python voice_agent.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Inherit the shared secrets from the web service — no need to paste them twice.
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: yatra-sahayak-agent
          envVarKey: OPENAI_API_KEY
      # LiveKit: set directly on BOTH services (can't inherit — the source
      # doesn't exist until you paste it, which would fail the blueprint sync).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: AGENT_NAME
        value: yatra-sahayak-voice
      - key: AGENT_API_HOST
        value: https://yatra-sahayak-agent.onrender.com
      - key: AGENT_API_KEY
        fromService:
          type: web
          name: yatra-sahayak-agent
          envVarKey: INTERNAL_API_KEY

databases:
  # Provisioned when the blueprint is synced — no manual DB creation needed.
  # Free plan (expires ~30 days; fine for the POC). The web service migrates
  # the schema (registrations/sos_events/user_state) automatically on boot.
  - name: yatra-sahayak-db
    plan: free
    databaseName: yatra
    user: yatra
