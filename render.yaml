services:
  - type: web
    name: yatra-sahayak-agent
    runtime: python
    plan: free
    rootDir: agent
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn webhook:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false                 # set on the dashboard (Realtime access needed for voice)
      - key: INTERNAL_API_KEY
        generateValue: true
      # Officer/admin key — guards the pilgrim-PII export (/api/registrations).
      # Distinct from INTERNAL_API_KEY (which the webview ships to the browser).
      - key: ADMIN_API_KEY
        generateValue: true
      # Officer war-room allowlist — comma-separated SwiftChat user_ids allowed
      # to use the officer bot (/officer/messages). The dashboard also unlocks
      # with ADMIN_API_KEY. Set on the dashboard.
      - key: OFFICER_IDS
        sync: false
      # SwiftChat webhook HMAC secret — when set, the officer bot's allowlist
      # path requires a valid signature (anti-spoof). Set once you have it.
      - key: SWIFTCHAT_WEBHOOK_SECRET
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      # Optional error tracking — set a Sentry DSN to enable (add sentry-sdk to
      # agent deps first).
      - key: SENTRY_DSN
        sync: false
      # Supabase Postgres (same stack as the reference build) — persists
      # registrations / SOS / user_state; DB_ENABLED flips on when set.
      # Paste both on the dashboard (Supabase → Project → Connect):
      #   DATABASE_URL = Connection pooling string (Transaction, port 6543)
      #   DIRECT_URL   = Direct connection string  (Session,     port 5432)
      # The app runs its pool on DATABASE_URL; migrations run on DIRECT_URL.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: LLM_MAIN_MODEL
        value: gpt-4o-mini
      - key: PUBLIC_WEBVIEW_BASE
        value: https://yatri.adityeah.ai
      # Lock browser CORS to the webview origin(s) (comma-separated). Add any
      # custom domain here. Server-to-server callers (SwiftChat) are unaffected.
      - key: CORS_ORIGINS
        value: https://yatra-sahayak-agent.vercel.app,https://yatri.adityeah.ai
      # LiveKit — set these three on the dashboard (the worker inherits them
      # via fromService, so you only paste them here, once).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: AGENT_NAME
        value: yatra-sahayak-voice

  - type: worker
    name: yatra-sahayak-voice
    runtime: python
    plan: starter
    rootDir: agent
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: python voice_agent.py start
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Inherit the shared secrets from the web service — no need to paste them twice.
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: yatra-sahayak-agent
          envVarKey: OPENAI_API_KEY
      # LiveKit: set directly on BOTH services (can't inherit — the source
      # doesn't exist until you paste it, which would fail the blueprint sync).
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: AGENT_NAME
        value: yatra-sahayak-voice
      - key: AGENT_API_HOST
        value: https://yatra-sahayak-agent.onrender.com
      - key: AGENT_API_KEY
        fromService:
          type: web
          name: yatra-sahayak-agent
          envVarKey: INTERNAL_API_KEY
